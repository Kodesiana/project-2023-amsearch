{% extends "layouts/login.html" %}

{% block content %}
<div class="columns is-centered is-mobile">
  <div class="column is-10-mobile is-8-tablet is-5-desktop is-4-widescreen">
    <!-- logo -->
    <div class="has-text-centered">
      <img src="{{ url_for('static', filename='logo-hd.png') }}" alt="logo" width="100">
    </div>
    <form class="box" action="{{ url_for('auth.login') }}" method="post">
      <!-- Login Form -->
      <div class="field">
        <label for="username" class="label has-text-black">{{ _('auth-input-username') }}</label>
        <div class="control has-icons-left">
          <input type="text" class="input" name="username" placeholder="{{ _('auth-input-username') }}" required>
          <span class="icon is-small is-left">
            <i class="fa fa-user"></i>
          </span>
        </div>
      </div>
      <div class="field">
        <label for="password" class="label has-text-black">{{ _('auth-input-password') }}</label>
        <div class="control has-icons-left">
          <input type="password" class="input" name="password" placeholder="{{ _('auth-input-password') }}" required>
          <span class="icon is-small is-left">
            <i class="fa fa-lock"></i>
          </span>
        </div>
      </div>
      <div class="field">
        <button class="button is-success is-fullwidth">
          {{ _('auth-action-login') }}
        </button>
      </div>
    </form>
    <!-- Login Error -->
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="notification is-danger">
      {% for message in messages %}
      {{ message | safe }}
      {% endfor %}
    </div>
    {% else %}
    <div class="notification has-background-success-light">
      <p>  </p>
    </div>
    {% endif %}

    {% endwith %}
  </div>
</div>
{% endblock %}
